{% extends 'base.html' %}
{% block content %}
<div>
    <h1 class="flex">Users List-1</h1>
    <a href="{% url 'create_user' %}" class="btn btn-dark">Create user</a>
</div>
<p>
<table class="table table-striped table-bordered table-hover">
    <thead class="thead-dark">
        <tr>
            <th>First Name</th>
            <th>last name</th>
            <th>email</th>
            <th>phone no</th>
            <th>address</th>
        </tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.fname }}</td>
            <td>{{ user.lname }}</td>
            <td>{{ user.email1 }}</td>
            <td>{{ user.phone1 }}</td>
            <td>{{ user.address1 }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</p>
{%endblock%}
