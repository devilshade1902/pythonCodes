{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetStore</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="D:\petstore\style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light" style="background-color:black; ">
        <div class="container text-dark" >
            <a class="navbar-brand" href='' style="color:white;">Pet Store</a>
            <button type="button" class="navbar-toggler" data-target="#navbarNav" data-toggle="collapse"
                aria-controls="#navbarNav" aria-expanded="false">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="navbar" id="navbarNav">
                <ul style="position: relative;right: 100px;" class="navbar-nav ml-auto text-light">
                    <li class="nav-item ">
                        <a class="nav-link text-light" href="{%url 'home'%}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light" href="{% url 'aboutus' %}">About Us</a>
                    </li>
                    <li class="navp-item">
                        <a class="nav-link text-light" href="D:\petstore\contact.html">Contact</a>
                    </li>
                    <li class="navp-item">
                        <a class="nav-link text-light" href="{%url 'pet_list'%}">Pets</a>
                    </li>
                    <li class="navp-item">
                        <a class="nav-link text-light" href="{% url 'product_list' %}">Products</a>
                    </li>
                    <li class="navp-item">
                        {% if user.is_authenticated %}
                        <span class="nav-link text-light">Hello {{user.username}}!!</span>
                        
                        <form action="{% url 'logout'%}" method="post">
                            {% csrf_token %}
                            <button class = 'btn-dark' style="position: relative;left: 100px; bottom: 30px; border: none;" type="submit">Logout</button>
                        </form>
                        {% else %}
                        <a class="nav-link text-light" href="{% url 'login' %}">Login</a>
                        {% endif %}
                    </li>
                </ul>
                <form action="{% url 'search' %}" class="form-inline">
                    <input type="search"  name='q'class="form-control mr-3" />
                    <button type="submit" class="btn btn-outline-success">search</button>
                </form>
            </div>
        </div>
    </nav>
    
    <div class="container mt-3 text-center">
        {% block content %}
        
        {% endblock %}
    </div>

    <footer class="footer-custom text-center py-2">
        <div class="container">
            <p>&copy;2024 Petstore Project | All Right Reserved</p>
            <div>
                <i class="bi bi-facebook"></i>
            </div>
        </div>
    </footer>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

</html>
